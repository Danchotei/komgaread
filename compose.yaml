services:
  manga:
    image: ghcr.io/${GHCR_NAMESPACE:-danchotei}/komgaread:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      KOMGA_URL: ${KOMGA_URL:-}
      SETUP_KEY: ${SETUP_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - manga-data:/data
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5); urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 40s
volumes:
  manga-data:
